<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Group Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        #chat-container {
            width: 400px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        #messageArea {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        #username-page,
        #chat-page {
            display: none;
        }

        .event-message {
            color: #888;
            font-style: italic;
        }

        .chat-message {
            margin: 5px 0;
        }

        .chat-message span {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="chat-container">
        <div id="username-page">
            <h2>Enter Chat Room</h2>
            <form id="usernameForm">
                <input type="text" id="name" placeholder="Enter your name" required autocomplete="off" />
                <button type="submit">Join</button>
            </form>
        </div>
        <div id="chat-page">
            <div id="messageArea"></div>
            <form id="messageForm">
                <input type="text" id="message" placeholder="Type a message..." autocomplete="off" required />
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        var username = null;
        var stompClient = null;
        var messageArea = document.querySelector('#messageArea');
        var usernamePage = document.querySelector('#username-page');
        var chatPage = document.querySelector('#chat-page');

        document.getElementById('usernameForm').addEventListener('submit', connect, true);
        document.getElementById('messageForm').addEventListener('submit', sendMessage, true);

        function connect(event) {
            event.preventDefault();
            username = document.querySelector('#name').value.trim();
            if (username) {
                usernamePage.style.display = 'none';
                chatPage.style.display = 'block';
                var socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);
                stompClient.connect({}, onConnected, onError);
            }
        }

        function onConnected() {
            stompClient.subscribe('/topic/public', onMessageReceived);
            stompClient.send("/app/chat.addUser", {}, JSON.stringify({ sender: username, type: 'JOIN' }));
        }

        function onError(error) {
            messageArea.innerHTML = '<p class="event-message">Could not connect to WebSocket server. Please refresh and try again!</p>';
        }

        function sendMessage(event) {
            event.preventDefault();
            var messageInput = document.querySelector('#message');
            var messageContent = messageInput.value.trim();
            if (messageContent && stompClient) {
                var chatMessage = {
                    sender: username,
                    content: messageContent,
                    type: 'CHAT'
                };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }

        function onMessageReceived(payload) {
            var message = JSON.parse(payload.body);
            var messageElement = document.createElement('div');
            if (message.type === 'JOIN') {
                messageElement.classList.add('event-message');
                messageElement.textContent = message.sender + ' joined!';
            } else if (message.type === 'LEAVE') {
                messageElement.classList.add('event-message');
                messageElement.textContent = message.sender + ' left!';
            } else {
                messageElement.classList.add('chat-message');
                var usernameSpan = document.createElement('span');
                usernameSpan.textContent = message.sender + ': ';
                messageElement.appendChild(usernameSpan);
                messageElement.appendChild(document.createTextNode(message.content));
            }
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        // Show username page on load
        usernamePage.style.display = 'block';
    </script>
</body>

</html>
